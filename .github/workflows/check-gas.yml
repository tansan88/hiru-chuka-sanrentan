# Apps Script に今どんなファイルが入っているかを確認する（手動で実行）
name: Apps Script の中身を確認

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 取得して一覧を出す
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          npm install -g @google/clasp@2.4.2 > /dev/null 2>&1
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          mkdir w && cd w
          printf '{"scriptId":"%s","fileExtension":"gs"}' "$SCRIPT_ID" > .clasp.json
          clasp pull > ../pull.log 2>&1 || { sed 's/^/::error::/' ../pull.log | head; exit 1; }
          sed 's/^/::notice::pull: /' ../pull.log | head -20
          for f in $(find . -type f ! -name '.clasp.json'); do echo "::notice::ファイル: $f （$(wc -c < "$f") バイト、const SHEETS の数: $(grep -c 'const SHEETS =' "$f")）"; done
          rm -f ~/.clasprc.json
