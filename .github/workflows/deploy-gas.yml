# gas/Code.gs を GitHub に反映したら、テストを走らせ、通ったときだけ Apps Script を更新して新しいバージョンをデプロイする
# コミットメッセージに [push-only] と書くと、Apps Script にコードを入れるだけでデプロイはしない（新しい許可が必要な変更のとき用）
# 必要なシークレット（Settings → Secrets and variables → Actions）
#   CLASPRC_JSON … clasp login でできた .clasprc.json の中身
#   SCRIPT_ID    … Apps Script の「プロジェクトの設定」にあるスクリプトID
# デプロイID は config.js の URL（/macros/s/〈ここ〉/exec）から読み取るので、URL は変わらない
# ブランチで行き先が変わる：test → テスト環境（config.js の API_URL_TEST）、main → 本番（API_URL）
# テスト環境のデプロイIDがまだ無いときは、新しく作ってIDを知らせる（config.js の API_URL_TEST に貼る）
name: Apps Script を更新

on:
  push:
    branches: [main, test]
    paths: ['gas/**', 'test/**', '*.js', '.github/workflows/deploy-gas.yml']
  workflow_dispatch:

concurrency:
  group: deploy-gas
  cancel-in-progress: false

env:
  # テスト用スプレッドシート「昼中華3連単（テスト）」の Apps Script（スクリプトIDは秘密の情報ではない）
  SCRIPT_ID_TEST: 1UD67MRCoRu3XKBu5DjKwNkFA1CpEjIJLufWdgehozZILke-TuNnGiPx9

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 画面のファイルに文法の誤りがないか
        run: for f in app.js share.js wok.js config.js; do node --check "$f" || exit 1; done
      - name: テストを実行
        run: node test/run.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 設定がそろっているか確認
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::warning::シークレット CLASPRC_JSON と SCRIPT_ID がまだ登録されていないので、今回はスキップしました"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${GITHUB_REF_NAME}" = "test" ]; then
            echo "target=test" >> "$GITHUB_OUTPUT"; echo "label=テスト環境" >> "$GITHUB_OUTPUT"
            echo "script_id=$SCRIPT_ID_TEST" >> "$GITHUB_OUTPUT"
            DEPLOYMENT_ID=$(grep 'API_URL_TEST' config.js | grep -oE 'macros/s/[A-Za-z0-9_-]+' | head -1 | sed 's#macros/s/##')
            echo "::notice::行き先：テスト環境（デプロイID: ${DEPLOYMENT_ID:-まだ無いので新しく作る}）"
          else
            echo "target=prod" >> "$GITHUB_OUTPUT"; echo "label=本番" >> "$GITHUB_OUTPUT"
            echo "script_id=$SCRIPT_ID" >> "$GITHUB_OUTPUT"
            DEPLOYMENT_ID=$(grep -E '^\s*API_URL:' config.js | grep -oE 'macros/s/[A-Za-z0-9_-]+' | head -1 | sed 's#macros/s/##')
            if [ -z "$DEPLOYMENT_ID" ]; then echo "::error::config.js からデプロイIDを読み取れませんでした"; exit 1; fi
            echo "::notice::行き先：本番"
          fi
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: '20'

      - name: clasp を用意
        if: steps.check.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          npm install -g @google/clasp@2.4.2
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          # 中身は出さずに、形だけ確かめる（キーの名前だけを表示）
          if ! jq -e . ~/.clasprc.json > /dev/null 2>&1; then echo "::error::CLASPRC_JSON がJSONとして読めません（貼り付けた範囲を確認してください）"; exit 1; fi
          echo "::notice::CLASPRC_JSON のキー: $(jq -c 'keys' ~/.clasprc.json) / token のキー: $(jq -c '(.token // {}) | keys' ~/.clasprc.json)"

      - name: いまの Apps Script を取得して、Code.gs だけ差し替える
        if: steps.check.outputs.ready == 'true'
        env:
          SCRIPT_ID: ${{ steps.check.outputs.script_id }}
        run: |
          mkdir -p work && cd work
          printf '{"scriptId":"%s","fileExtension":"gs"}' "$SCRIPT_ID" > .clasp.json
          clasp pull > ../pull.log 2>&1 || { sed 's/^/::error::clasp pull: /' ../pull.log | head -20; exit 1; }
          cat ../pull.log
          test -f appsscript.json || { echo "::error::appsscript.json を取得できませんでした"; exit 1; }
          # このアプリのサーバーのファイル（コード.gs など名前は問わない）を1つにまとめ、中身を GitHub の Code.gs にする
          # 同じ内容のファイルが2つあると「Identifier has already been declared」で動かなくなるため
          for f in *.gs; do
            [ -e "$f" ] || continue
            if grep -q '昼中華3連単 サーバー' "$f"; then echo "置き換え対象: $f"; rm -f "$f"; fi
          done
          # Apps Script 側のメインのファイル（「const SHEETS =」を含むもの）を探し、その名前のまま中身を差し替える
          # （エディタで作ったプロジェクトは「コード.gs」という名前のことがある。同じ中身のファイルが2つあると動かなくなるので、余分なものは消す）
          MAIN=""
          for f in *.gs; do
            [ -f "$f" ] || continue
            if grep -q 'const SHEETS =' "$f"; then
              if [ -z "$MAIN" ] && [ "$f" != "Code.gs" ]; then MAIN="$f"; else rm -f "$f"; fi
            fi
          done
          # 新しく作ったプロジェクトに最初からある空の「コード.gs」（myFunction だけのもの）は消す
          for f in *.gs; do
            [ -f "$f" ] || continue
            if [ "$(wc -c < "$f")" -lt 200 ] && grep -q 'function myFunction' "$f"; then echo "空の初期ファイルを削除: $f"; rm -f "$f"; fi
          done
          if [ -z "$MAIN" ]; then MAIN="Code.gs"; fi
          cp ../gas/Code.gs "$MAIN"
          # テスト環境：ウェブアプリの設定が無ければ、本番と同じ設定を入れる（自分として実行・誰でもアクセス可）
          if [ "${{ steps.check.outputs.target }}" = "test" ] && ! jq -e '.webapp' appsscript.json > /dev/null; then
            jq '.timeZone = "Asia/Tokyo" | .runtimeVersion = "V8" | .webapp = {"executeAs": "USER_DEPLOYING", "access": "ANYONE_ANONYMOUS"}' appsscript.json > m.json && mv m.json appsscript.json
            echo "::notice::テスト環境にウェブアプリの設定を入れました"
          fi
          echo "::notice::差し替えたファイル: $MAIN / プロジェクトのファイル: $(ls *.gs *.json | tr '\n' ' ')"
          ls -la

      - name: 公開前の確認（Apps Script に入るファイルを全部合わせて読み込めるか）
        if: steps.check.outputs.ready == 'true'
        run: |
          cd work
          N=$(grep -l 'const SHEETS =' *.gs | wc -l)
          if [ "$N" != "1" ]; then echo "::error::メインのファイルが $N 個あります（1個のはず）"; exit 1; fi
          cat *.gs > ../all.js
          node -e "new Function(require('fs').readFileSync('../all.js','utf8'))" || { echo "::error::Apps Script のファイルを合わせると読み込めません（二重定義など）"; exit 1; }
          n=$(grep -l 'const SHEETS' *.gs | wc -l)
          if [ "$n" != "1" ]; then echo "::error::サーバーのファイルが1つになりませんでした（$n 個）"; exit 1; fi

      - name: Apps Script にコードを反映
        if: steps.check.outputs.ready == 'true'
        run: |
          cd work
          clasp push --force > ../push.log 2>&1 || { sed 's/^/::error::clasp push: /' ../push.log | head -20; exit 1; }
          cat ../push.log

      - name: 新しいバージョンをデプロイ
        id: deploy
        if: steps.check.outputs.ready == 'true' && !contains(github.event.head_commit.message, '[push-only]')
        run: |
          cd work
          DID="${{ steps.check.outputs.deployment_id }}"
          if [ -z "$DID" ]; then
            # テスト環境の最初の1回：新しいデプロイを作る
            clasp deploy --description "テスト環境 GitHub ${GITHUB_SHA::7}" | tee ../deploy.log
            DID=$(grep -oE 'AKfy[A-Za-z0-9_-]+' ../deploy.log | head -1)
            if [ -z "$DID" ]; then echo "::error::新しいデプロイのIDを読み取れませんでした"; exit 1; fi
            echo "::notice::テスト環境のURL: https://script.google.com/macros/s/$DID/exec （config.js の API_URL_TEST に入れる）"
          else
            PREV=$(clasp deployments 2>/dev/null | grep -F "$DID" | grep -oE '@[0-9]+' | tr -d '@' | head -1)
            echo "prev=$PREV" >> "$GITHUB_OUTPUT"
            echo "::notice::これまでのバージョン: ${PREV:-不明}"
            clasp deploy --deploymentId "$DID" --description "GitHub ${GITHUB_SHA::7}"
          fi
          echo "did=$DID" >> "$GITHUB_OUTPUT"
          echo "### ${{ steps.check.outputs.label }}の Apps Script を更新しました（${GITHUB_SHA::7}）" >> "$GITHUB_STEP_SUMMARY"

      - name: 公開後の確認（URLが正しく返事をするか。本番でだめなら前のバージョンに戻す）
        if: steps.deploy.outcome == 'success'
        run: |
          URL="https://script.google.com/macros/s/${{ steps.deploy.outputs.did }}/exec"
          OK=""
          for i in 1 2 3 4 5; do
            sleep 5
            BODY=$(curl -sL -m 30 "$URL" || true)
            if echo "$BODY" | grep -q '"ok":true'; then OK=1; break; fi
          done
          if [ -n "$OK" ]; then echo "### ${{ steps.check.outputs.label }}の確認：OK" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ "${{ steps.check.outputs.target }}" = "test" ]; then
            echo "::warning::テスト環境のURLが正しく返事をしません。初めてのときは、テスト用の Apps Script で関数「初期設定」を実行して許可してください：$(echo "$BODY" | head -c 120)"
            exit 0
          fi
          echo "::error::本番のURLが正しく返事をしません：$(echo "$BODY" | head -c 200)"
          PREV="${{ steps.deploy.outputs.prev }}"
          if [ -n "$PREV" ]; then
            cd work && clasp deploy --deploymentId "${{ steps.deploy.outputs.did }}" --versionNumber "$PREV" --description "自動で戻しました（${GITHUB_SHA::7} の確認に失敗）"
            echo "::error::バージョン $PREV に戻しました"
          fi
          exit 1

      - name: 後片付け
        if: always()
        run: rm -f ~/.clasprc.json
